  parameters: {}
paths:
  /api/v1/wb-reports/pnl:
    get:
      operationId: wbReportsGetPnl
      summary: Get WB P&L report
      description: "19.05 contract: P&L can be operative/preliminary/blocked; final
        state is forbidden while source blockers remain."
      parameters:
        - schema:
            type: string
            format: date
          required: false
          name: dateFrom
          in: query
        - schema:
            type: string
            format: date
          required: false
          name: dateTo
          in: query
        - schema:
            type: string
            enum:
              - operational
              - financial
          required: false
          name: source
          in: query
        - schema:
            type: string
            enum:
              - sku
              - brand
              - manager
              - category
              - status
          required: false
          name: groupBy
          in: query
      responses:
        "200":
          description: P&L report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PnlReportResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/wb-reports/ads/performance:
    get:
      operationId: wbReportsGetAdsPerformance
      summary: Get WB Ads performance report
      description: "19.05 contract: campaign-only spend stays campaign-level and must
        not be presented as exact SKU P&L."
      parameters:
        - schema:
            type: string
            format: date
          required: false
          name: dateFrom
          in: query
        - schema:
            type: string
            format: date
          required: false
          name: dateTo
          in: query
        - schema:
            type: string
            enum: &a6
              - sku
              - brand
              - manager
              - category
              - status
              - warehouse
