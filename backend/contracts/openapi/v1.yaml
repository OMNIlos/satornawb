                - "null"
              minimum: 0
            impressions:
              type:
                - integer
                - "null"
              minimum: 0
            clicks:
              type:
                - integer
                - "null"
              minimum: 0
            cartAdds:
              type:
                - integer
                - "null"
              minimum: 0
            ordersCount:
              type:
                - integer
                - "null"
              minimum: 0
            ordersKopecks:
              type:
                - integer
                - "null"
              minimum: 0
            drrPct:
              type:
                - number
                - "null"
            romiPct:
              type:
                - number
                - "null"
            roiPct:
              type:
                - number
                - "null"
          required:
