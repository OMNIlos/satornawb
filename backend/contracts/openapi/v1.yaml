openapi: 3.1.0
info:
  title: Vella WB API contracts
  version: 0.19.05-runtime-boundary
  description: Frontend-first OpenAPI artifact for 19.05 WB contract delta. Draft
    until backend review confirms WB source availability.
servers:
  - url: /
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    PnlReportResponse:
      type: object
      properties:
        sourceStatus:
          type: string
          enum: &a1
            - fresh
            - partial
            - stale
            - blocked
            - unknown
        confidence:
          type: string
          enum: &a2
            - high
            - medium
            - low
            - blocked
        blockerIds:
          type: array
          items:
            type: string
            minLength: 1
        sourceEvidence:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                minLength: 1
              sourceType:
                type: string
                enum: &a3
                  - wb_api
                  - wb_excel
                  - manual
                  - derived
                  - mock
              sourceName:
                type: string
                minLength: 1
              lastSyncedAt:
                type:
                  - string
                  - "null"
                format: date-time
              freshnessTtlMinutes:
                type:
                  - integer
                  - "null"
                exclusiveMinimum: 0
              fieldsUsed:
                type: array
                items:
                  type: string
                  minLength: 1
            required:
              - sourceId
              - sourceType
              - sourceName
              - lastSyncedAt
              - freshnessTtlMinutes
              - fieldsUsed
        calculatedAt:
          type: string
          format: date-time
        period:
          type: object
          properties:
            dateFrom:
              type: string
              format: date
            dateTo:
              type: string
              format: date
          required:
            - dateFrom
            - dateTo
        reportState:
          type: string
          enum:
            - operative
            - preliminary
            - final
            - blocked
        groupBy:
          type: string
          enum: &a4
            - sku
            - brand
            - manager
            - category
            - status
            - warehouse
            - campaign
        totals:
          type: object
          properties:
            revenueKopecks:
              type:
                - integer
                - "null"
              minimum: 0
            netProfitKopecks:
              type:
                - integer
                - "null"
            marginPct:
              type:
                - number
                - "null"
            sourceStatus:
              type: string
              enum: *a1
            confidence:
              type: string
              enum: *a2
          required:
            - revenueKopecks
            - netProfitKopecks
            - marginPct
            - sourceStatus
            - confidence
        rows:
          type: array
          items:
            type: object
            properties:
              rowId:
                type: string
                minLength: 1
              label:
                type: string
                minLength: 1
              brandId:
                type:
                  - string
                  - "null"
              managerId:
                type:
                  - string
                  - "null"
              skuId:
                type:
                  - string
                  - "null"
              revenueKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              cogsKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              commissionKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              logisticsKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              storageKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              adSpendKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              taxKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              overheadKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              netProfitKopecks:
                type:
                  - integer
                  - "null"
              marginPct:
                type:
                  - number
                  - "null"
              sourceStatus:
                type: string
                enum: *a1
              confidence:
                type: string
                enum: *a2
            required:
              - rowId
              - label
              - brandId
              - managerId
              - skuId
              - revenueKopecks
              - cogsKopecks
              - commissionKopecks
              - logisticsKopecks
              - storageKopecks
              - adSpendKopecks
              - taxKopecks
              - overheadKopecks
              - netProfitKopecks
              - marginPct
              - sourceStatus
              - confidence
        fieldMapping:
          type: array
          items:
            type: object
            properties:
              metricId:
                type: string
                minLength: 1
              metricLabel:
                type: string
                minLength: 1
              sourceId:
                type: string
                minLength: 1
              sourceField:
                type:
                  - string
                  - "null"
                minLength: 1
              formula:
                type: string
                minLength: 1
              fallback:
                type:
                  - string
                  - "null"
                minLength: 1
              blockerIds:
                type: array
                items:
                  type: string
                  minLength: 1
            required:
              - metricId
              - metricLabel
              - sourceId
              - sourceField
              - formula
              - fallback
              - blockerIds
        manualCosts:
          type: array
          items:
            type: object
            properties:
              costId:
                type: string
                minLength: 1
              label:
                type: string
                minLength: 1
              amountKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              allocationBase:
                type: string
                enum:
                  - sku
                  - brand
                  - manager
                  - marketplace
                  - manual
                  - unknown
              sourceStatus:
                type: string
                enum: *a1
              blockerIds:
                type: array
                items:
                  type: string
                  minLength: 1
            required:
              - costId
              - label
              - amountKopecks
              - allocationBase
              - sourceStatus
              - blockerIds
        dayAllocation:
          type: object
          properties:
            allocationDateField:
              type:
                - string
                - "null"
              minLength: 1
            expenseDateField:
              type:
                - string
                - "null"
              minLength: 1
            rule:
              type: string
              minLength: 1
            sourceStatus:
              type: string
              enum: *a1
            blockerIds:
              type: array
              items:
                type: string
                minLength: 1
          required:
            - allocationDateField
            - expenseDateField
            - rule
            - sourceStatus
            - blockerIds
      required:
        - sourceStatus
        - confidence
        - blockerIds
        - sourceEvidence
        - calculatedAt
        - period
        - reportState
        - groupBy
        - totals
        - rows
        - fieldMapping
        - manualCosts
        - dayAllocation
