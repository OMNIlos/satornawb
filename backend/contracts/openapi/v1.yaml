            - impressions
            - clicks
            - cartAdds
            - ordersCount
            - ordersKopecks
            - drrPct
            - romiPct
            - roiPct
        rows:
          type: array
          items:
            type: object
            properties:
              rowId:
                type: string
                minLength: 1
              campaignId:
                type:
                  - string
                  - "null"
              skuId:
                type:
                  - string
                  - "null"
              brandId:
                type:
                  - string
                  - "null"
              managerId:
                type:
                  - string
                  - "null"
              adSpendKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              impressions:
                type:
                  - integer
                  - "null"
                minimum: 0
              clicks:
                type:
                  - integer
                  - "null"
                minimum: 0
              cartAdds:
                type:
                  - integer
                  - "null"
                minimum: 0
              ordersCount:
                type:
                  - integer
                  - "null"
                minimum: 0
              ordersKopecks:
                type:
                  - integer
                  - "null"
                minimum: 0
              drrPct:
                type:
                  - number
                  - "null"
              romiPct:
                type:
                  - number
                  - "null"
              roiPct:
                type:
                  - number
                  - "null"
              attributionLevel:
                type: string
                enum: &a5
                  - exact_sku
                  - campaign_sku
                  - campaign_only
                  - unknown
              confidence:
                type: string
                enum: *a2
            required:
              - rowId
              - campaignId
              - skuId
              - brandId
              - managerId
              - adSpendKopecks
              - impressions
              - clicks
              - cartAdds
              - ordersCount
              - ordersKopecks
              - drrPct
              - romiPct
              - roiPct
              - attributionLevel
              - confidence
        attributionPolicy:
          type: object
          properties:
            allowedSkuLevels:
              type: array
              items:
                type: string
                enum: *a5
            campaignOnlyCanAllocateToSkuPnl:
              type: boolean
            notes:
              type: array
              items:
                type: string
                minLength: 1
