[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vella-backend"
version = "0.1.0"
description = "Vella WB Sprint A backend skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124",
  "pydantic>=2.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "cryptography>=44,<46",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "uvicorn>=0.38",
]

[project.optional-dependencies]
test = [
  "setuptools>=69",
  "wheel",
  "httpx>=0.28",
  "pytest>=8.4",
  "datamodel-code-generator>=0.58",
]

[tool.setuptools]
packages = ["app", "app.avito", "app.contracts", "app.discovery", "app.routers", "app.wb_api", "app.source_registry", "app.control_plane", "app.account_health", "app.cabinet", "app.cash_flow", "app.repricer_cache", "app.repricer_persistence", "app.report_rules", "app.reviews", "app.modules", "app.modules.wb_reports", "app.platform", "app.platform.advertising", "app.platform.catalog", "app.platform.economics", "app.platform.finance", "app.platform.funnel", "app.platform.identity", "app.platform.integrations", "app.security", "vella_wb_19_05", "app.infra", "app.wb_ads_cache"]

[tool.setuptools.package-dir]
vella_wb_19_05 = "backend_contracts/vella_wb_19_05"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend_contracts"]
