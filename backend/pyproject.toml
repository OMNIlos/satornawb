[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vella-backend"
version = "0.1.0"
description = "Vella WB Sprint A backend skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.124",
  "pydantic>=2.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "cryptography>=44,<46",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "uvicorn>=0.38",
  "pypdfium2>=4.30,<6",
  "zxing-cpp>=2.3,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = [
  "reportlab>=4,<5",
  "setuptools>=69",
  "wheel",
  "httpx>=0.28",
  "pytest>=8.4",
  "datamodel-code-generator>=0.58",
]

[tool.setuptools.packages.find]
where = [".", "backend_contracts"]
include = ["app", "app.*", "vella_wb_19_05", "vella_wb_19_05.*"]
namespaces = true

[tool.setuptools.package-dir]
vella_wb_19_05 = "backend_contracts/vella_wb_19_05"

[tool.setuptools.package-data]
"app.wb_api" = ["*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend_contracts"]
