# Alternate Satorna entry point; keep existing API and health URLs intact.
server {
    listen 443 ssl;
    server_name api.elfprint-system.ru;

    ssl_certificate /etc/letsencrypt/live/api.elfprint-system.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.elfprint-system.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/satorna-frontend/current;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(api(?:/|$)|health(?:/|$)) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    location ^~ /downloads/ {
        alias /var/www/satorna-frontend/current/api-downloads/;
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/index.html /index.html;
    }
}

server {
    listen 80;
    server_name api.elfprint-system.ru;
    return 301 https://$host$request_uri;
}
