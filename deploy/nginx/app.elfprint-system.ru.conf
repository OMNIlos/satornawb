# Satorna frontend (React SPA) + same-origin API proxy on the Beget server.
# Installed as /etc/nginx/sites-available/app.elfprint-system.ru and symlinked
# into sites-enabled. The lines marked "managed by Certbot" are written by
# certbot's nginx plugin, like for the other sites on that host.
server {
    server_name app.elfprint-system.ru;

    root /var/www/satorna-frontend/current;

    access_log /var/log/nginx/app.elfprint-system.ru.access.log;
    error_log  /var/log/nginx/app.elfprint-system.ru.error.log;

    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # API: straight to the vella-api container on this host, with the same
    # upstream, limits and timeouts as api.elfprint-system.ru.
    # Replaces the Vercel rewrites and serverless functions.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # "/api" without a slash is not an API call: treat it like any other page
    # (otherwise nginx answers with its own redirect to "/api/").
    location = /api {
        expires -1;
        try_files /index.html =404;
    }

    # Vite build output: content-hashed file names, safe to cache for a long time.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else: a real file, a folder's own index.html, otherwise the SPA.
    location / {
        expires -1;
        try_files $uri $uri/index.html /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.elfprint-system.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.elfprint-system.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = app.elfprint-system.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.elfprint-system.ru;
    return 404; # managed by Certbot
}
